name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Check source and build exact packages
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RUKIE_TEST_WORKERS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
      - name: Install pinned npm and workspace dependencies
        run: |
          npm install --global npm@11.21.0
          bun install --frozen-lockfile
      - name: Bind checkout and supported host
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bun -e 'if (process.platform !== "darwin" || process.arch !== "arm64") throw new Error("Installed acceptance requires darwin-arm64")'
          echo "RUKIE_RELEASE_ARTIFACTS=$RUNNER_TEMP/rukie-release" >> "$GITHUB_ENV"
      - name: Check Conventional Commit PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx --no -- commitlint
      - name: Validate workflow syntax with pinned actionlint
        run: |
          curl --fail --location --retry 2 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_darwin_arm64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' aba9ced2dee8d27fecca3dc7feb1a7f9a52caefa1eb46f3271ea66b6e0e6953f "$RUNNER_TEMP/actionlint.tar.gz" | shasum -a 256 --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck='' -pyflakes=''
      - name: Check source constraints
        id: check
        run: |
          if env -u NO_COLOR bun run check:dev > "$RUNNER_TEMP/rukie-check.log" 2>&1; then
            tail -n 8 "$RUNNER_TEMP/rukie-check.log"
          else
            tail -n 120 "$RUNNER_TEMP/rukie-check.log"
            exit 1
          fi
      - name: Build the installed artifacts once
        run: bun run release:build --out "$RUKIE_RELEASE_ARTIFACTS" --platform darwin-arm64
      - name: Verify clean source and artifact identity
        run: bun run release:verify --artifact-dir "$RUKIE_RELEASE_ARTIFACTS" --require-clean --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.RUKIE_RELEASE_ARTIFACTS }}/*.tgz
            ${{ env.RUKIE_RELEASE_ARTIFACTS }}/release-build.json
            ${{ env.RUKIE_RELEASE_ARTIFACTS }}/release-modules.json
          if-no-files-found: error
          retention-days: 1
      - name: Preserve complete check log
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-check-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rukie-check.log
          if-no-files-found: warn
          retention-days: 1
  tests:
    needs: build
    uses: ./.github/workflows/release-tests.yml
    with:
      artifact: candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      commit: ${{ github.sha }}
    permissions:
      contents: read
      actions: read
  verify:
    name: Source and installed darwin-arm64
    needs: [build, tests]
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
      - name: Install pinned npm and workspace dependencies
        run: |
          npm install --global npm@11.21.0
          bun install --frozen-lockfile
      - name: Bind checkout and supported host
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bun -e 'if (process.platform !== "darwin" || process.arch !== "arm64") throw new Error("Installed acceptance requires darwin-arm64")'
          echo "RUKIE_RELEASE_ARTIFACTS=$RUNNER_TEMP/rukie-release" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rukie-release
      - name: Record accepted artifact identity
        run: bun scripts/release/ci-audit.ts --artifact-dir "$RUKIE_RELEASE_ARTIFACTS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rukie-darwin-arm64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.RUKIE_RELEASE_ARTIFACTS }}/*.tgz
            ${{ env.RUKIE_RELEASE_ARTIFACTS }}/release-build.json
            ${{ env.RUKIE_RELEASE_ARTIFACTS }}/release-modules.json
            ${{ env.RUKIE_RELEASE_ARTIFACTS }}/ci-acceptance.json
          if-no-files-found: error
          retention-days: 14
