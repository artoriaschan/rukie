name: Publish npm release
on:
  push:
    tags: [coding-agent-v*]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing product tag; select this same tag as the workflow ref
        required: true
        type: string
      operation:
        description: Ordinary publication recovery, or explicit rollback of a complete existing version
        required: true
        type: choice
        default: publish
        options: [publish, rollback]
env:
  RELEASE_OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'publish' }}
permissions:
  contents: read
concurrency:
  group: npm-publication
  cancel-in-progress: false
jobs:
  resolve:
    name: Resolve exact product tag
    runs-on: macos-15
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
      - run: |
          npm install --global npm@11.21.0
          bun install --frozen-lockfile
      - id: tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bun scripts/release/tag.ts --tag "$RELEASE_TAG"
  build:
    name: Check source and select exact tagged packages
    needs: resolve
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
      RUKIE_TEST_WORKERS: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
      - run: |
          npm install --global npm@11.21.0
          bun install --frozen-lockfile
      - name: Select original assets or first build
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bun -e 'if (process.platform !== "darwin" || process.arch !== "arm64") throw new Error("Publication acceptance requires darwin-arm64")'
          echo "RUKIE_RELEASE_ARTIFACTS=$RUNNER_TEMP/rukie-release" >> "$GITHUB_ENV"
          state=$(bun scripts/release/assets.ts --mode download --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --artifact-dir "$RUNNER_TEMP/rukie-release")
          if [ "$state" = new ]; then
            if [ "$RELEASE_OPERATION" = rollback ]; then
              echo "Rollback requires preserved original assets; it never builds or uploads packages" >&2
              exit 1
            fi
            bun scripts/release/tag.ts --tag "$RELEASE_TAG" --require-unpublished
            bun run release:build --out "$RUNNER_TEMP/rukie-release" --platform darwin-arm64
          fi
      - name: Check source constraints
        id: check
        run: |
          if env -u NO_COLOR bun run check:dev > "$RUNNER_TEMP/rukie-check.log" 2>&1; then
            tail -n 8 "$RUNNER_TEMP/rukie-check.log"
          else
            tail -n 120 "$RUNNER_TEMP/rukie-check.log"
            exit 1
          fi
      - name: Verify exact clean source and repository identity
        run: bun scripts/release/tag.ts --tag "$RELEASE_TAG" --artifact-dir "$RUKIE_RELEASE_ARTIFACTS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-${{ needs.resolve.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.RUKIE_RELEASE_ARTIFACTS }}/*.tgz
            ${{ env.RUKIE_RELEASE_ARTIFACTS }}/release-build.json
            ${{ env.RUKIE_RELEASE_ARTIFACTS }}/release-modules.json
            ${{ env.RUKIE_RELEASE_ARTIFACTS }}/ci-acceptance.json
          if-no-files-found: error
          retention-days: 1
      - name: Preserve complete check log
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-check-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rukie-check.log
          if-no-files-found: warn
          retention-days: 1
  tests:
    needs: [resolve, build]
    uses: ./.github/workflows/release-tests.yml
    with:
      artifact: candidate-${{ needs.resolve.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
      commit: ${{ needs.resolve.outputs.commit }}
    permissions:
      contents: read
      actions: read
  verify:
    name: Verify source and installed darwin-arm64
    needs: [resolve, build, tests]
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
      RUKIE_TEST_WORKERS: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
      - run: |
          npm install --global npm@11.21.0
          bun install --frozen-lockfile
      - run: echo "RUKIE_RELEASE_ARTIFACTS=$RUNNER_TEMP/rukie-release" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-${{ needs.resolve.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rukie-release
      - name: Verify exact clean source and repository identity
        run: bun scripts/release/tag.ts --tag "$RELEASE_TAG" --artifact-dir "$RUKIE_RELEASE_ARTIFACTS"
      - name: Record this run without overwriting original acceptance
        run: |
          bun scripts/release/ci-audit.ts --artifact-dir "$RUKIE_RELEASE_ARTIFACTS" --output "$RUKIE_RELEASE_ARTIFACTS/current-acceptance.json"
          if [ ! -f "$RUKIE_RELEASE_ARTIFACTS/ci-acceptance.json" ]; then
            cp "$RUKIE_RELEASE_ARTIFACTS/current-acceptance.json" "$RUKIE_RELEASE_ARTIFACTS/ci-acceptance.json"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accepted-${{ needs.resolve.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.RUKIE_RELEASE_ARTIFACTS }}/*.tgz
            ${{ env.RUKIE_RELEASE_ARTIFACTS }}/release-build.json
            ${{ env.RUKIE_RELEASE_ARTIFACTS }}/release-modules.json
            ${{ env.RUKIE_RELEASE_ARTIFACTS }}/ci-acceptance.json
            ${{ env.RUKIE_RELEASE_ARTIFACTS }}/current-acceptance.json
          if-no-files-found: error
  preserve:
    name: Preserve original accepted assets
    needs: [resolve, verify]
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
      - run: |
          npm install --global npm@11.21.0
          bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: accepted-${{ needs.resolve.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rukie-release
      - run: echo "RUKIE_RELEASE_ARTIFACTS=$RUNNER_TEMP/rukie-release" >> "$GITHUB_ENV"
      - run: bun scripts/release/assets.ts --mode preserve --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --artifact-dir "$RUKIE_RELEASE_ARTIFACTS"
  publish:
    name: Publish exact accepted npm packages
    needs: [resolve, verify, preserve]
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
      - run: |
          npm install --global npm@11.21.0
          bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: accepted-${{ needs.resolve.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rukie-release
      - run: echo "RUKIE_RELEASE_ARTIFACTS=$RUNNER_TEMP/rukie-release" >> "$GITHUB_ENV"
      - run: bun run release:publish --artifact-dir "$RUKIE_RELEASE_ARTIFACTS" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --operation "$RELEASE_OPERATION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUKIE_RELEASE_ARTIFACTS }}/publication-result.json
          if-no-files-found: error
  report:
    name: Attach npm result separately from Release creation
    needs: [resolve, verify, publish]
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
      - run: |
          npm install --global npm@11.21.0
          bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: accepted-${{ needs.resolve.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rukie-release
      - run: echo "RUKIE_RELEASE_ARTIFACTS=$RUNNER_TEMP/rukie-release" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rukie-release
      - run: bun scripts/release/assets.ts --mode receipt --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --artifact-dir "$RUKIE_RELEASE_ARTIFACTS"
