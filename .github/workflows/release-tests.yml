name: Test exact release artifacts

on:
  workflow_call:
    inputs:
      artifact:
        required: true
        type: string
      commit:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Test shard ${{ matrix.shard }} of 3
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      RUKIE_TEST_WORKERS: 1
      TEST_SHARD: ${{ matrix.shard }}
      RELEASE_COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
      - run: |
          npm install --global npm@11.21.0
          bun install --frozen-lockfile
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "RUKIE_RELEASE_ARTIFACTS=$RUNNER_TEMP/rukie-release" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/rukie-release
      - name: Verify exact source and original artifact identity
        run: bun run release:verify --artifact-dir "$RUKIE_RELEASE_ARTIFACTS" --require-clean --commit "$RELEASE_COMMIT"
      - name: Run this source and installed test shard
        id: check
        run: |
          if env -u NO_COLOR bun run test --shard="$TEST_SHARD/3" > "$RUNNER_TEMP/rukie-check.log" 2>&1; then
            tail -n 8 "$RUNNER_TEMP/rukie-check.log"
          else
            tail -n 120 "$RUNNER_TEMP/rukie-check.log"
            exit 1
          fi
      - name: Verify tests preserved clean source and original packages
        run: |
          test -z "$(git status --porcelain --untracked-files=normal)"
          bun run release:verify --artifact-dir "$RUKIE_RELEASE_ARTIFACTS" --require-clean --commit "$RELEASE_COMMIT"
      - name: Preserve complete shard log
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-check-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rukie-check.log
          if-no-files-found: warn
          retention-days: 1
